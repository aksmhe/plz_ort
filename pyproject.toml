[project]
name = "plz_ort"
authors = [
    { name = "AffiKSys", email = "m.heide@affiksys.com" }
]
description = "Füllt in ERPNext/Frappe Ort und Bundesland/Kanton aus der Postleitzahl, für Deutschland, Österreich, Schweiz und Liechtenstein (OpenPLZ API)."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
